x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    tag: "{{.Name}}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: streaming
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: streaming
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streaming"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://streaming:${POSTGRES_PASSWORD:-}@postgres:5432/streaming
      JWT_SECRET: ${JWT_SECRET:-}
      SFU_JOIN_SECRET: ${SFU_JOIN_SECRET:-}
      # Required when SFU is on another host; omitted → clients use same-origin /ws/signaling
      SFU_PUBLIC_WS_URL: ${SFU_PUBLIC_WS_URL:-}
      WEB_ORIGIN: http://web
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PORT: 3000
    volumes:
      - recordings:/app/server/recordings
    shm_size: "512m"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:-}
    volumes:
      - web_letsencrypt:/etc/letsencrypt
      - web_certbot_www:/var/www/certbot

  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    logging: *default-logging
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot || true
          sleep 12h & wait $$!
        done
    volumes:
      - web_letsencrypt:/etc/letsencrypt
      - web_certbot_www:/var/www/certbot

  # Opt-in via --profile sfu. Default `up` (API box) never starts these.
  # On the SFU box: --profile sfu up -d --build sfu sfu-nginx sfu-certbot
  sfu:
    profiles: ["sfu"]
    build:
      context: .
      dockerfile: sfu/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "3001"
    ports:
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"
    environment:
      NODE_ENV: production
      SFU_JOIN_SECRET: ${SFU_JOIN_SECRET:-}
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-}
      MEDIASOUP_RTC_MIN_PORT: 40000
      MEDIASOUP_RTC_MAX_PORT: 40100
      PORT: 3001

  sfu-nginx:
    profiles: ["sfu"]
    build:
      context: ./sfu/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - sfu
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${SFU_SERVER_NAME:-}
    volumes:
      - sfu_letsencrypt:/etc/letsencrypt
      - sfu_certbot_www:/var/www/certbot

  sfu-certbot:
    profiles: ["sfu"]
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    logging: *default-logging
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot || true
          sleep 12h & wait $$!
        done
    volumes:
      - sfu_letsencrypt:/etc/letsencrypt
      - sfu_certbot_www:/var/www/certbot

  # Continuous host/container samples for post-live CPU/RAM diagnosis (t3 credit exhaustion, OOM).
  # Writes to the shared recordings volume under diagnostics/host-stats.log
  monitor:
    image: docker:27-cli
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - recordings:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /data/diagnostics
        echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) monitor started" >> /data/diagnostics/host-stats.log
        while true; do
          {
            echo "=== $$(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.NetIO}}' 2>/dev/null || true
          } >> /data/diagnostics/host-stats.log
          sleep 15
        done

volumes:
  pg_data:
  recordings:
  web_letsencrypt:
  web_certbot_www:
  sfu_letsencrypt:
  sfu_certbot_www:
