x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    tag: "{{.Name}}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: streaming
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: streaming
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streaming"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://streaming:${POSTGRES_PASSWORD:-}@postgres:5432/streaming
      JWT_SECRET: ${JWT_SECRET:-}
      SFU_JOIN_SECRET: ${SFU_JOIN_SECRET:-}
      # Required when SFU is on another host; omitted → clients use same-origin /ws/signaling
      SFU_PUBLIC_WS_URL: ${SFU_PUBLIC_WS_URL:-}
      COMPOSITOR_URL: ${COMPOSITOR_URL:-}
      COMPOSITOR_INTERNAL_SECRET: ${COMPOSITOR_INTERNAL_SECRET:-}
      AWS_REGION: ${AWS_REGION:-}
      # Optional — omit for EC2 instance role (default credential chain).
      # Empty values must not be set; only pass when present in .env.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-recordings}
      PORT: 3000

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:-}
    volumes:
      - web_letsencrypt:/etc/letsencrypt

  # Helper only — used by `docker compose run` in scripts/issue-cert.sh (DNS-01).
  # Not started by default; no renew loop (manual DNS does not auto-renew).
  certbot:
    profiles: ["tools"]
    image: certbot/certbot:v2.11.0
    volumes:
      - web_letsencrypt:/etc/letsencrypt

  # Opt-in via --profile sfu. Default `up` (API box) never starts these.
  # On the SFU box: --profile sfu up -d --build sfu sfu-nginx
  sfu:
    profiles: ["sfu"]
    build:
      context: .
      dockerfile: sfu/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "3001"
    ports:
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"
    environment:
      NODE_ENV: production
      SFU_JOIN_SECRET: ${SFU_JOIN_SECRET:-}
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-}
      MEDIASOUP_RTC_MIN_PORT: 40000
      MEDIASOUP_RTC_MAX_PORT: 40100
      PORT: 3001

  sfu-nginx:
    profiles: ["sfu"]
    build:
      context: ./sfu/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - sfu
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${SFU_SERVER_NAME:-}
    volumes:
      - sfu_letsencrypt:/etc/letsencrypt

  sfu-certbot:
    profiles: ["tools"]
    image: certbot/certbot:v2.11.0
    volumes:
      - sfu_letsencrypt:/etc/letsencrypt

  # Opt-in via --profile compositor. On the compositor box:
  # --profile compositor up -d --build compositor compositor-nginx monitor
  compositor:
    profiles: ["compositor"]
    build:
      context: .
      dockerfile: compositor/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 3002
      COMPOSITOR_INTERNAL_SECRET: ${COMPOSITOR_INTERNAL_SECRET:-}
      COMPOSITOR_POOL_SIZE: ${COMPOSITOR_POOL_SIZE:-2}
      # Public studio origin — Chromium loads /compositor from the API/web box.
      WEB_ORIGIN: ${COMPOSITOR_WEB_ORIGIN:-}
      SFU_PUBLIC_WS_URL: ${SFU_PUBLIC_WS_URL:-}
      # Docker-internal MediaRecorder sink. Chromium loads HTTPS WEB_ORIGIN, so the
      # pool launches with --allow-running-insecure-content for this ws:// URL.
      RECORDING_SINK_URL: ws://compositor:3002/ws/recording
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    volumes:
      - recordings:/app/compositor/recordings
    shm_size: "512m"

  compositor-nginx:
    profiles: ["compositor"]
    build:
      context: ./compositor/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - compositor
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${COMPOSITOR_SERVER_NAME:-}
    volumes:
      - compositor_letsencrypt:/etc/letsencrypt

  compositor-certbot:
    profiles: ["tools"]
    image: certbot/certbot:v2.11.0
    volumes:
      - compositor_letsencrypt:/etc/letsencrypt

  # Continuous host/container samples for post-live CPU/RAM diagnosis.
  # On the compositor box (where recordings live).
  monitor:
    profiles: ["compositor"]
    image: docker:27-cli
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - recordings:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /data/diagnostics
        echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) monitor started" >> /data/diagnostics/host-stats.log
        while true; do
          {
            echo "=== $$(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.NetIO}}' 2>/dev/null || true
          } >> /data/diagnostics/host-stats.log
          sleep 15
        done

volumes:
  pg_data:
  recordings:
  web_letsencrypt:
  sfu_letsencrypt:
  compositor_letsencrypt:
