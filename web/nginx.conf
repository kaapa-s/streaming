server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — re-resolve after container recreate (avoids stale IPs → 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Signaling goes direct to the SFU via SFU_PUBLIC_WS_URL (join API / compositor).
    # Do not proxy /ws/signaling here — that requires a local `sfu` service.

    location /ws/ {
        set $server_upstream http://server:3000;
        proxy_pass         $server_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        set $server_upstream http://server:3000;
        proxy_pass         $server_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
