x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    tag: "{{.Name}}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: streaming
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: streaming
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streaming"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://streaming:${POSTGRES_PASSWORD}@postgres:5432/streaming
      JWT_SECRET: ${JWT_SECRET}
      SFU_JOIN_SECRET: ${SFU_JOIN_SECRET}
      WEB_ORIGIN: http://web
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP}
      MEDIASOUP_RTC_MIN_PORT: 40000
      MEDIASOUP_RTC_MAX_PORT: 40100
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PORT: 3000
    volumes:
      - recordings:/app/recordings
    shm_size: "512m"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - server
    ports:
      # Bound to localhost so host nginx + certbot own 80/443
      - "127.0.0.1:8080:80"

  # Continuous host/container samples for post-live CPU/RAM diagnosis (t3 credit exhaustion, OOM).
  # Writes to the shared recordings volume under diagnostics/host-stats.log
  monitor:
    image: docker:27-cli
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - recordings:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /data/diagnostics
        echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) monitor started" >> /data/diagnostics/host-stats.log
        while true; do
          {
            echo "=== $$(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.NetIO}}' 2>/dev/null || true
          } >> /data/diagnostics/host-stats.log
          sleep 15
        done

volumes:
  pg_data:
  recordings:
